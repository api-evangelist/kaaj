aid: kaaj
name: Kaaj
description: >-
  Kaaj is the agentic AI underwriting operating system for small business (SMB)
  lending. It helps lenders, brokers, equipment finance companies, merchant cash
  advance (MCA) funders, and community banks turn messy borrower packages into
  decision-ready credit analysis in under five minutes. Specialized AI agents
  handle document intake and classification across 40+ document types, Know-Your-
  Business (KYB) verification, bank statement analysis and cash-flow spreading,
  fraud and document-tampering detection, and evidence-backed credit memo
  generation, with a human-in-the-loop by design. Kaaj layers onto existing
  underwriting operations through email intake, embedded forms, a REST API with
  webhooks, and CRM/LOS integrations (Salesforce, HubSpot, Dynamics). Founded in
  San Francisco in 2024 by Utsav Shah and Shivi Sharma, Kaaj is SOC 2 Type II
  compliant and has processed over $15B in loan originations.
